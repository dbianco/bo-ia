[project]
name = "bo-ia-backend"
version = "0.1.0"
description = "Backend del MVP de búsqueda semántica del Boletín Oficial (ingestor + procesador + API)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pgvector>=0.3,<1.0",
    "sentence-transformers>=3.3,<4.0",
    "alembic>=1.14,<2.0",
    "pydantic-settings>=2.6,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.27,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: tests que descargan o cargan el modelo real de embeddings (excluidos de la corrida rápida con -m 'not slow')",
    "docker: smoke tests que levantan el stack completo con docker compose (lentos, requieren Docker)",
]
