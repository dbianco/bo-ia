[project]
name = "bo-ia-backend"
version = "0.1.0"
description = "Backend del MVP de búsqueda semántica del Boletín Oficial (ingestor + procesador + API)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pgvector>=0.3,<1.0",
    "sentence-transformers>=6.0,<7.0",
    "transformers>=5.10,<6.0",  # >=5.10.0 corrige CVE-2026-9856 y las demás CVEs de PYSEC-2026-* (pip-audit)
    "alembic>=1.14,<2.0",
    "pydantic-settings>=2.6,<3.0",
    "pyyaml>=6.0,<7.0",  # parsea installation.yaml (config de instalación); no hay parser YAML en la librería estándar
    "scrapy>=2.19,<3.0",  # motor de conectores (Etapa 2); recomendado por docs/superpowers/reports/2026-09-23-scraping-poc.md
    "apscheduler>=3.11,<4.0",  # scheduler in-process (Etapa 2)
    "pypdf>=6.0,<7.0",  # extracción de texto de PDF en el conector del BOP (Etapa 2)
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",  # >=9.0.3 corrige PYSEC-2026-1845 (pip-audit)
    "httpx>=0.27,<1.0",
    "ruff>=0.16,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
# Migraciones de Alembic: scaffold autogenerado (alembic revision) que solo
# se completa con las operaciones DDL; no vale la pena mantenerlo al día con
# reglas de estilo que cambian con cada versión de ruff.
extend-exclude = ["src/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # el largo de línea ya lo cubre line-length; no lo trato como error duro
    "B008",  # Depends()/Query() como default de argumento es el patrón estándar de FastAPI
    "UP047",  # TypeVar clásico en vez de sintaxis genérica PEP 695; ambos son válidos, no vale el churn
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: tests que descargan o cargan el modelo real de embeddings (excluidos de la corrida rápida con -m 'not slow')",
    "docker: smoke tests que levantan el stack completo con docker compose (lentos, requieren Docker)",
    "live: tests que hacen una llamada de red real a un sitio externo (excluidos por defecto y de CI)",
]
