services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-9100}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_CACHE_DIR: ${EMBEDDING_CACHE_DIR}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-model}
      EMBEDDING_SEED: ${EMBEDDING_SEED:-0}
      EMBEDDING_SYNONYMS: ${EMBEDDING_SYNONYMS:-}
      EMBEDDING_PRECOMPUTED: ${EMBEDDING_PRECOMPUTED:-}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD}
      MATCHING_ENGINE: ${MATCHING_ENGINE:-indexed}
      MATCHING_POLL_SECONDS: ${MATCHING_POLL_SECONDS:-1}
      SEARCH_ENGINE: ${SEARCH_ENGINE:-postgres}
      RRF_WEIGHTS: ${RRF_WEIGHTS:-1,1}
      INSTALLATION_CONFIG: ${INSTALLATION_CONFIG}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
      LINK_SECRET: ${LINK_SECRET:-}
      DIGEST_HOUR: ${DIGEST_HOUR:-7}
      EMAIL_MAX_RETRIES: ${EMAIL_MAX_RETRIES:-48}
      NOTIFICATIONS_POLL_SECONDS: ${NOTIFICATIONS_POLL_SECONDS:-5}
      RATE_LIMIT_SEARCH: ${RATE_LIMIT_SEARCH:-}
      RATE_LIMIT_RATINGS: ${RATE_LIMIT_RATINGS:-}
      RATE_LIMIT_REGISTER: ${RATE_LIMIT_REGISTER:-}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-}
      RATE_LIMIT_PUBLIC: ${RATE_LIMIT_PUBLIC:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES-web}
    ports:
      - "${BACKEND_PORT:-9101}:8000"
    volumes:
      - model-cache:${EMBEDDING_CACHE_DIR}
      - ./config/installation.yaml:${INSTALLATION_CONFIG}:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: ./web
    depends_on:
      - backend
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "${WEB_PORT:-9102}:8080"

volumes:
  db-data:
  model-cache:
