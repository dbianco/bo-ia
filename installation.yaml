# Configuración de instalación (Etapa 1 — núcleo genérico, ver sección 8
# de docs/superpowers/specs/2026-09-18-plataforma-tematica-reutilizable-design.md).
# "Configuración antes que código": una nueva fuente o un filtro nuevo se
# agregan acá, no en el motor.

nombre: Boletines Córdoba

fuentes:
  - clave: cordoba-provincial
    nombre: Boletín Oficial de la Provincia de Córdoba
    # Etapa 2 apuntaba por error a bop.dipucordoba.es (Diputación de
    # Córdoba, ESPAÑA); corregido en la Etapa 5 al sitio real de Córdoba,
    # Argentina. Sin `fecha` en config, usa la fecha de hoy en cada
    # corrida. `bop-cordoba-scrapy` (España) sigue registrado como
    # conector de referencia, sin usarse acá (ver spec.md de la Etapa 5).
    conector:
      tipo: boletin-cba-pdf-diario
      frecuencia_minutos: 1440
      config:
        url_template: "https://boletinoficial.cba.gov.ar/wp-content/4p96humuzp/{anio}/{mes}/{seccion}_Secc_{ddmmyy}.pdf"
        secciones: [1, 2, 3, 4, 5]
  - clave: carlos-paz-municipal
    nombre: Boletín Municipal de Carlos Paz
  - clave: noetinger-municipal
    nombre: Boletín Municipal de Noetinger

filtros:
  - clave: provincia
    etiqueta: Provincia
    tipo: seleccion
  - clave: municipio
    etiqueta: Municipio
    tipo: seleccion
