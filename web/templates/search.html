<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ nombre_instalacion }} — Búsqueda semántica</title>
  <script>
    (function () {
      var tema = "dark";
      try {
        if (localStorage.getItem("tema") === "light") tema = "light";
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", tema);
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <main>
    <div class="encabezado">
      <div>
        <h1>{{ nombre_instalacion }}</h1>
        <p class="subtitulo">Búsqueda semántica sobre documentos oficiales.</p>
      </div>
      <button
        type="button"
        id="theme-toggle"
        class="theme-toggle"
        aria-pressed="false"
        aria-label="Cambiar a tema claro"
      >🌙</button>
    </div>

    <form role="search" hx-get="/resultados" hx-target="#resultados" hx-indicator="#buscando">
      <div>
        <label for="q">Consulta</label>
        <input type="text" id="q" name="q" required autocomplete="off" placeholder="ej: presupuesto provincial">
      </div>
      <div class="form-fechas">
        <div>
          <label for="date_from">Desde</label>
          <div class="campo-fecha">
            <input type="date" id="date_from" name="date_from">
            <button type="button" class="borrar-fecha" data-target="date_from" aria-label="Borrar fecha desde" hidden>×</button>
          </div>
        </div>
        <div>
          <label for="date_to">Hasta</label>
          <div class="campo-fecha">
            <input type="date" id="date_to" name="date_to">
            <button type="button" class="borrar-fecha" data-target="date_to" aria-label="Borrar fecha hasta" hidden>×</button>
          </div>
        </div>
      </div>
      {% if filtros %}
      <fieldset class="filtros-instalacion">
        <legend>Filtros</legend>
        <div class="opciones-modo">
          {% for f in filtros %}
          <div>
            <label for="filtro-{{ f.clave }}">{{ f.etiqueta }}</label>
            <input
              type="text"
              id="filtro-{{ f.clave }}"
              name="filtro.{{ f.clave }}"
              autocomplete="off"
              placeholder="{{ 'min,max' if f.tipo == 'rango_numerico' else f.etiqueta }}"
            >
          </div>
          {% endfor %}
        </div>
      </fieldset>
      {% endif %}
      <fieldset class="modo-busqueda">
        <legend>Modo de búsqueda</legend>
        <div class="opciones-modo">
          <label class="opcion-modo" title="Busca por significado, aunque no coincidan las palabras exactas.">
            <input type="radio" name="mode" value="semantic" checked>
            <span>Semántica</span>
          </label>
          <label class="opcion-modo" title="Semántica combinada con coincidencia de texto exacto.">
            <input type="radio" name="mode" value="hybrid">
            <span>Híbrida</span>
          </label>
          <label class="opcion-modo" title="Todos los resultados, sin filtrar por confianza.">
            <input type="radio" name="mode" value="all">
            <span>Todo</span>
          </label>
        </div>
      </fieldset>
      <button type="submit">Buscar</button>
      <span id="buscando" class="htmx-indicator" role="status">Buscando…</span>
    </form>

    <section id="resultados" aria-live="polite"></section>
  </main>
  <script src="/static/theme.js"></script>
  <script src="/static/fechas.js"></script>
</body>
</html>
