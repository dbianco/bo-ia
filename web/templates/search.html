<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boletín Oficial de Córdoba — Búsqueda semántica</title>
  <script>
    (function () {
      var tema = "dark";
      try {
        if (localStorage.getItem("tema") === "light") tema = "light";
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", tema);
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <main>
    <div class="encabezado">
      <div>
        <h1>Boletín Oficial de Córdoba</h1>
        <p class="subtitulo">Búsqueda semántica sobre boletines oficiales (MVP).</p>
      </div>
      <button
        type="button"
        id="theme-toggle"
        class="theme-toggle"
        aria-pressed="false"
        aria-label="Cambiar a tema claro"
      >🌙</button>
    </div>

    <form role="search" hx-get="/resultados" hx-target="#resultados" hx-indicator="#buscando">
      <div>
        <label for="q">Consulta</label>
        <input type="text" id="q" name="q" required autocomplete="off" placeholder="ej: presupuesto provincial">
      </div>
      <div class="form-fechas">
        <div>
          <label for="date_from">Desde</label>
          <input type="date" id="date_from" name="date_from">
        </div>
        <div>
          <label for="date_to">Hasta</label>
          <input type="date" id="date_to" name="date_to">
        </div>
      </div>
      <div>
        <label for="mode">Modo de búsqueda</label>
        <select id="mode" name="mode">
          <option value="semantic" selected>Semántica (default)</option>
          <option value="hybrid">Híbrida (semántica + texto exacto)</option>
          <option value="all">Todo (sin filtrar por confianza)</option>
        </select>
      </div>
      <button type="submit">Buscar</button>
      <span id="buscando" class="htmx-indicator" role="status">Buscando…</span>
    </form>

    <section id="resultados" aria-live="polite"></section>
  </main>
  <script src="/static/theme.js"></script>
</body>
</html>
