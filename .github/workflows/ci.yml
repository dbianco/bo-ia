name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bo_ia
          POSTGRES_PASSWORD: dev_only_change_me
          POSTGRES_DB: bo_ia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bo_ia -d bo_ia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://bo_ia:dev_only_change_me@localhost:5432/bo_ia
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias (torch CPU-only)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Tests (incluye la verificación real del modelo de embeddings)
        run: pytest -m "not docker" -v

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Levantar el stack completo con un solo comando (FR-016)
        run: docker compose up -d --build --wait

      - name: Verificar búsqueda real contra los datos de ejemplo (FR-017)
        run: |
          curl -sf http://localhost:9101/health
          curl -sf http://localhost:9102/health
          resultado=$(curl -sf "http://localhost:9101/v1/search?q=presupuesto+provincial")
          echo "$resultado"
          echo "$resultado" | python3 -c "import json, sys; d = json.load(sys.stdin); assert d['total'] > 0, 'sin resultados confiables'"

      - name: Bajar el stack
        if: always()
        run: docker compose down
